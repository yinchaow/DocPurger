name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without v prefix, e.g. 1.3.0)'
        required: true
        default: '1.3.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v${VERSION}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            VERSION=$(grep '^VERSION=' scripts/build-all.sh | head -n1 | cut -d'"' -f2)
            TAG=""
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Update VERSION in scripts/build-all.sh
        run: |
          sed -i "s/^VERSION=.*/VERSION=\"${{ steps.meta.outputs.version }}\"/" scripts/build-all.sh

      - name: Build Kylin V10 SP1 & Windows artifacts
        run: |
          chmod +x scripts/build-all.sh
          ./scripts/build-all.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DocPurger-${{ steps.meta.outputs.version }}
          path: |
            dist/DocPurger_${{ steps.meta.outputs.version }}_windows_amd64.exe
            dist/DocPurger_${{ steps.meta.outputs.version }}_kylin_v10_sp1_amd64.deb
            dist/DocPurger_${{ steps.meta.outputs.version }}_kylin_v10_sp1_amd64.tar.gz

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: DocPurger ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/DocPurger_${{ steps.meta.outputs.version }}_windows_amd64.exe
            dist/DocPurger_${{ steps.meta.outputs.version }}_kylin_v10_sp1_amd64.deb
            dist/DocPurger_${{ steps.meta.outputs.version }}_kylin_v10_sp1_amd64.tar.gz
